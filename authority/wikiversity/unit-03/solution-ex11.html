Dann ist</p>

<dl><dd><math class="mwe-math-element mwe-math-element-inline" typeof="mw:Extension/math" about="#mwt4" data-mw='{"name":"math","attrs":{},"body":{"extsrc":" {{}} \\begin{align} &amp; \\, \\, \\, \\, \\, \\, \\,  (1+f)  \\left(  1-f+f^2-f^3+f^4 \\pm \\ldots \\pm f^{k-1}  \\right) \n \\\\\n&amp;  =  1-f+f^2-f^3+f^4 \\pm \\ldots \\pm f^{k-1}  +f -f^2+f^3-f^4 \\mp \\ldots \\mp f^{k-1}\n \\\\\n&amp;  =  1\n . \\, \\end{align} "}}'><mrow data-mjx-texclass="ORD"><mstyle displaystyle="true" scriptlevel="0"><mtable displaystyle="true"><mtr><mtd class="mwe-math-columnalign-r"></mtd><mtd class="mwe-math-columnalign-l"><mspace width="0.167em"></mspace><mspace width="0.167em"></mspace><mspace width="0.167em"></mspace><mspace width="0.167em"></mspace><mspace width="0.167em"></mspace><mspace width="0.167em"></mspace><mspace width="0.167em"></mspace><mo stretchy="false">(</mo><mn>1</mn><mo stretchy="false">+</mo><mi>f</mi><mo stretchy="false">)</mo><mrow data-mjx-texclass="INNER"><mo data-mjx-texclass="OPEN">(</mo><mn>1</mn><mo stretchy="false">−</mo><mi>f</mi><mo stretchy="false">+</mo><msup><mi>f</mi><mrow data-mjx-texclass="ORD"><mn>2</mn></mrow></msup><mo stretchy="false">−</mo><msup><mi>f</mi><mrow data-mjx-texclass="ORD"><mn>3</mn></mrow></msup><mo stretchy="false">+</mo><msup><mi>f</mi><mrow data-mjx-texclass="ORD"><mn>4</mn></mrow></msup><mo stretchy="false">±</mo><mo stretchy="false">…</mo><mo stretchy="false">±</mo><msup><mi>f</mi><mrow data-mjx-texclass="ORD"><mrow data-mjx-texclass="ORD"><mi>k</mi><mo stretchy="false">−</mo><mn>1</mn></mrow></mrow></msup><mo data-mjx-texclass="CLOSE">)</mo></mrow></mtd></mtr><mtr><mtd class="mwe-math-columnalign-r"></mtd><mtd class="mwe-math-columnalign-l"><mo stretchy="false">=</mo><mn>1</mn><mo stretchy="false">−</mo><mi>f</mi><mo stretchy="false">+</mo><msup><mi>f</mi><mrow data-mjx-texclass="ORD"><mn>2</mn></mrow></msup><mo stretchy="false">−</mo><msup><mi>f</mi><mrow data-mjx-texclass="ORD"><mn>3</mn></mrow></msup><mo stretchy="false">+</mo><msup><mi>f</mi><mrow data-mjx-texclass="ORD"><mn>4</mn></mrow></msup><mo stretchy="false">±</mo><mo stretchy="false">…</mo><mo stretchy="false">±</mo><msup><mi>f</mi><mrow data-mjx-texclass="ORD"><mrow data-mjx-texclass="ORD"><mi>k</mi><mo stretchy="false">−</mo><mn>1</mn></mrow></mrow></msup><mo stretchy="false">+</mo><mi>f</mi><mo stretchy="false">−</mo><msup><mi>f</mi><mrow data-mjx-texclass="ORD"><mn>2</mn></mrow></msup><mo stretchy="false">+</mo><msup><mi>f</mi><mrow data-mjx-texclass="ORD"><mn>3</mn></mrow></msup><mo stretchy="false">−</mo><msup><mi>f</mi><mrow data-mjx-texclass="ORD"><mn>4</mn></mrow></msup><mo stretchy="false">∓</mo><mo stretchy="false">…</mo><mo stretchy="false">∓</mo><msup><mi>f</mi><mrow data-mjx-texclass="ORD"><mrow data-mjx-texclass="ORD"><mi>k</mi><mo stretchy="false">−</mo><mn>1</mn></mrow></mrow></msup></mtd></mtr><mtr><mtd class="mwe-math-columnalign-r"></mtd><mtd class="mwe-math-columnalign-l"><mo stretchy="false">=</mo><mn>1.</mn><mspace width="0.167em"></mspace></mtd></mtr></mtable></mstyle></mrow></math></dd></dl>
