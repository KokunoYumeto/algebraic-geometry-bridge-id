<p>Es sei
</p>
<dl><dd> <math class="mwe-math-element mwe-math-element-inline" xmlns="http://www.w3.org/1998/Math/MathML"><mrow data-mjx-texclass="ORD"><mstyle displaystyle="true" scriptlevel="0"><mi>G</mi><mo stretchy="false">=</mo><munder><mo movablelimits="false" stretchy="false">∑</mo><mrow data-mjx-texclass="ORD"><mrow data-mjx-texclass="ORD"><mi>ν</mi><mo stretchy="false">∈</mo><msup><mrow data-mjx-texclass="ORD"><mi>ℕ</mi></mrow><mrow data-mjx-texclass="ORD"><mi>n</mi></mrow></msup></mrow></mrow></munder><msub><mi>a</mi><mrow data-mjx-texclass="ORD"><mi>ν</mi></mrow></msub><msup><mi>X</mi><mrow data-mjx-texclass="ORD"><mi>ν</mi></mrow></msup><msup><mi>Z</mi><mrow data-mjx-texclass="ORD"><mrow data-mjx-texclass="ORD"><mi>d</mi><mo stretchy="false">−</mo><mo stretchy="false">|</mo><mi>ν</mi><mo stretchy="false">|</mo></mrow></mrow></msup><mspace width="0.167em"></mspace></mstyle></mrow></math></dd></dl>
<p>und
</p>
<dl><dd> <math class="mwe-math-element mwe-math-element-inline" xmlns="http://www.w3.org/1998/Math/MathML"><mrow data-mjx-texclass="ORD"><mstyle displaystyle="true" scriptlevel="0"><mi>H</mi><mo stretchy="false">=</mo><munder><mo movablelimits="false" stretchy="false">∑</mo><mrow data-mjx-texclass="ORD"><mrow data-mjx-texclass="ORD"><mi>ν</mi><mo stretchy="false">∈</mo><msup><mrow data-mjx-texclass="ORD"><mi>ℕ</mi></mrow><mrow data-mjx-texclass="ORD"><mi>n</mi></mrow></msup></mrow></mrow></munder><msub><mi>b</mi><mrow data-mjx-texclass="ORD"><mi>ν</mi></mrow></msub><msup><mi>X</mi><mrow data-mjx-texclass="ORD"><mi>ν</mi></mrow></msup><msup><mi>Z</mi><mrow data-mjx-texclass="ORD"><mrow data-mjx-texclass="ORD"><mi>d</mi><mo stretchy="false">−</mo><mo stretchy="false">|</mo><mi>ν</mi><mo stretchy="false">|</mo></mrow></mrow></msup><mspace width="0.167em"></mspace><mo>,</mo></mstyle></mrow></math></dd></dl>
<p>wobei <math class="mwe-math-element mwe-math-element-inline" xmlns="http://www.w3.org/1998/Math/MathML"><mrow data-mjx-texclass="ORD"><mstyle displaystyle="true" scriptlevel="0"><mi>d</mi></mstyle></mrow></math> der gemeinsame Grad von
<math class="mwe-math-element mwe-math-element-inline" xmlns="http://www.w3.org/1998/Math/MathML"><mrow data-mjx-texclass="ORD"><mstyle displaystyle="true" scriptlevel="0"><mi>G</mi></mstyle></mrow></math> und  <math class="mwe-math-element mwe-math-element-inline" xmlns="http://www.w3.org/1998/Math/MathML"><mrow data-mjx-texclass="ORD"><mstyle displaystyle="true" scriptlevel="0"><mi>H</mi></mstyle></mrow></math>
sei. Die Dehomogenisierungen sind
<math class="mwe-math-element mwe-math-element-inline" xmlns="http://www.w3.org/1998/Math/MathML"><mrow data-mjx-texclass="ORD"><mstyle displaystyle="true" scriptlevel="0"><munder><mo movablelimits="false" stretchy="false">∑</mo><mrow data-mjx-texclass="ORD"><mrow data-mjx-texclass="ORD"><mi>ν</mi><mo stretchy="false">∈</mo><msup><mrow data-mjx-texclass="ORD"><mi>ℕ</mi></mrow><mrow data-mjx-texclass="ORD"><mi>n</mi></mrow></msup></mrow></mrow></munder><msub><mi>a</mi><mrow data-mjx-texclass="ORD"><mi>ν</mi></mrow></msub><msup><mi>X</mi><mrow data-mjx-texclass="ORD"><mi>ν</mi></mrow></msup></mstyle></mrow></math> und  <math class="mwe-math-element mwe-math-element-inline" xmlns="http://www.w3.org/1998/Math/MathML"><mrow data-mjx-texclass="ORD"><mstyle displaystyle="true" scriptlevel="0"><munder><mo movablelimits="false" stretchy="false">∑</mo><mrow data-mjx-texclass="ORD"><mrow data-mjx-texclass="ORD"><mi>ν</mi><mo stretchy="false">∈</mo><msup><mrow data-mjx-texclass="ORD"><mi>ℕ</mi></mrow><mrow data-mjx-texclass="ORD"><mi>n</mi></mrow></msup></mrow></mrow></munder><msub><mi>b</mi><mrow data-mjx-texclass="ORD"><mi>ν</mi></mrow></msub><msup><mi>X</mi><mrow data-mjx-texclass="ORD"><mi>ν</mi></mrow></msup></mstyle></mrow></math>,
die nach Voraussetzung gleich sind. Daher ist
</p>
<dl><dd> <math class="mwe-math-element mwe-math-element-inline" xmlns="http://www.w3.org/1998/Math/MathML"><mrow data-mjx-texclass="ORD"><mstyle displaystyle="true" scriptlevel="0"><msub><mi>a</mi><mrow data-mjx-texclass="ORD"><mi>ν</mi></mrow></msub><mo stretchy="false">=</mo><msub><mi>b</mi><mrow data-mjx-texclass="ORD"><mi>ν</mi></mrow></msub><mspace width="0.167em"></mspace></mstyle></mrow></math></dd></dl>
für alle <math class="mwe-math-element mwe-math-element-inline" xmlns="http://www.w3.org/1998/Math/MathML"><mrow data-mjx-texclass="ORD"><mstyle displaystyle="true" scriptlevel="0"><mi>ν</mi></mstyle></mrow></math> und somit stimmen auch die Ausgangspolynome überein.</div>
