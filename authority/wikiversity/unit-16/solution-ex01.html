<div style="margin:1.5em; border:5px solid grey; padding: 1em; background-color:; font-align:font-size:100%;font-size: 1.4em">
<p>Es sei <math class="mwe-math-element mwe-math-element-inline" xmlns="http://www.w3.org/1998/Math/MathML"><mrow data-mjx-texclass="ORD"><mstyle displaystyle="true" scriptlevel="0"><mi>F</mi></mstyle></mrow></math> ein irreduzbiler Filter. Zu jedem
&#160;<math class="mwe-math-element mwe-math-element-inline" xmlns="http://www.w3.org/1998/Math/MathML"><mrow data-mjx-texclass="ORD"><mstyle displaystyle="true" scriptlevel="0"><mi>U</mi><mo stretchy="false">∈</mo><mi>F</mi></mstyle></mrow></math>&#160;
ist
</p>
<dl><dd> <math class="mwe-math-element mwe-math-element-inline" xmlns="http://www.w3.org/1998/Math/MathML"><mrow data-mjx-texclass="ORD"><mstyle displaystyle="true" scriptlevel="0"><mi>U</mi><mo stretchy="false">=</mo><mi>D</mi><mo stretchy="false">(</mo><msub><mi>f</mi><mrow data-mjx-texclass="ORD"><mn>1</mn></mrow></msub><mo stretchy="false">)</mo><mo stretchy="false">∪</mo><mo stretchy="false">…</mo><mo stretchy="false">∪</mo><mi>D</mi><mo stretchy="false">(</mo><msub><mi>f</mi><mrow data-mjx-texclass="ORD"><mi>k</mi></mrow></msub><mo stretchy="false">)</mo><mspace width="0.167em"></mspace><mo stretchy="false">.</mo></mstyle></mrow></math></dd></dl>
<p>Aufgrund der Irreduzibilität muss
&#160;<math class="mwe-math-element mwe-math-element-inline" xmlns="http://www.w3.org/1998/Math/MathML"><mrow data-mjx-texclass="ORD"><mstyle displaystyle="true" scriptlevel="0"><mi>D</mi><mo stretchy="false">(</mo><msub><mi>f</mi><mrow data-mjx-texclass="ORD"><mi>i</mi></mrow></msub><mo stretchy="false">)</mo><mo stretchy="false">∈</mo><mi>F</mi></mstyle></mrow></math>&#160;
für ein <math class="mwe-math-element mwe-math-element-inline" xmlns="http://www.w3.org/1998/Math/MathML"><mrow data-mjx-texclass="ORD"><mstyle displaystyle="true" scriptlevel="0"><mi>i</mi></mstyle></mrow></math> sein. Wegen
</p>
<dl><dd> <math class="mwe-math-element mwe-math-element-inline" xmlns="http://www.w3.org/1998/Math/MathML"><mrow data-mjx-texclass="ORD"><mstyle displaystyle="true" scriptlevel="0"><mi>D</mi><mo stretchy="false">(</mo><msub><mi>f</mi><mrow data-mjx-texclass="ORD"><mi>i</mi></mrow></msub><mo stretchy="false">)</mo><mo stretchy="false">⊆</mo><mi>U</mi><mspace width="0.167em"></mspace></mstyle></mrow></math></dd></dl>
erzeugen also die in <math class="mwe-math-element mwe-math-element-inline" xmlns="http://www.w3.org/1998/Math/MathML"><mrow data-mjx-texclass="ORD"><mstyle displaystyle="true" scriptlevel="0"><mi>F</mi></mstyle></mrow></math> enthaltenen offenen Mengen der Form <math class="mwe-math-element mwe-math-element-inline" xmlns="http://www.w3.org/1998/Math/MathML"><mrow data-mjx-texclass="ORD"><mstyle displaystyle="true" scriptlevel="0"><mi>D</mi><mo stretchy="false">(</mo><mi>f</mi><mo stretchy="false">)</mo></mstyle></mrow></math> den Filter.</div>
