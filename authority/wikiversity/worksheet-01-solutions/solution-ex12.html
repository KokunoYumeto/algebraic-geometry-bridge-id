+1)\n||\n||\n||\n|SZ=.\n}}\nDie Schnittpunkte {{mathl|term= C \\cap G |SZ=}} kann man berechnen, indem man die auf {{math|term= G |SZ=}} gültige Gleichung\n{{\nRelationskette\n|Y\n|| -1\n||\n||\n||\n|SZ=\n}}\nin die Kurvengleichung einsetzt. Man erhält\n{{\nRelationskette/display\n| 0\n|| X^3+(-1)^3 +1\n|| X^3\n||\n||\n|SZ=.\n}}\nDie einzige Lösung ist\n{{\nRelationskette\n|X\n|| 0\n||\n||\n||\n|SZ=,\n}}\nalso ist {{mathl|term= (0,-1) |SZ=}} der einzige Schnittpunkt von\n{{\nmathkor|term1=\nG\n|und|term2=\nC\n|SZ=.\n}}"},"Textart":{"wt":"Lösung"},"Kategorie":{"wt":"Siehe"},"Kategorie2":{"wt":""},"Kategorie3":{"wt":""},"Objektkategorie":{"wt":""},"Stichwort":{"wt":""},"Aufgabe":{"wt":""},"Autor":{"wt":""},"Bearbeitungsstand":{"wt":""}},"i":0}}]}' id="mwAg">
	
</span><div style="margin:1.5em; border:5px solid grey; padding: 1em; background-color:; font-align:font-size:100%;font-size: 1.4em" about="#mwt1">
	
<p>Wir betrachten die Gerade</p>
<dl><dd> <math class="mwe-math-element mwe-math-element-inline" typeof="mw:Extension/math" about="#mwt3" data-mw='{"name":"math","attrs":{},"body":{"extsrc":"{{}} G\n  \n=  V(Y+1)\n\n\n\n\n\n\n \n\n\n\n \\,   .\n"}}'><mrow data-mjx-texclass="ORD"><mstyle displaystyle="true" scriptlevel="0"><mi>G</mi><mo stretchy="false">=</mo><mi>V</mi><mo stretchy="false">(</mo><mi>Y</mi><mo stretchy="false">+</mo><mn>1</mn><mo stretchy="false">)</mo><mspace width="0.167em"></mspace><mo stretchy="false">.</mo></mstyle></mrow></math></dd></dl>
<p>Die Schnittpunkte <math class="mwe-math-element mwe-math-element-inline" typeof="mw:Extension/math" about="#mwt4" data-mw='{"name":"math","attrs":{},"body":{"extsrc":"{{}} C \\cap G"}}'><mrow data-mjx-texclass="ORD"><mstyle displaystyle="true" scriptlevel="0"><mi>C</mi><mo stretchy="false">∩</mo><mi>G</mi></mstyle></mrow></math> kann man berechnen, indem man die auf <math class="mwe-math-element mwe-math-element-inline" typeof="mw:Extension/math" about="#mwt5" data-mw='{"name":"math","attrs":{},"body":{"extsrc":" {{}} G"}}'><mrow data-mjx-texclass="ORD"><mstyle displaystyle="true" scriptlevel="0"><mi>G</mi></mstyle></mrow></math> gültige Gleichung
<span typeof="mw:Entity"> </span><math class="mwe-math-element mwe-math-element-inline" typeof="mw:Extension/math" about="#mwt6" data-mw='{"name":"math","attrs":{},"body":{"extsrc":" {{}} Y\n  \n=  -1"}}'><mrow data-mjx-texclass="ORD"><mstyle displaystyle="true" scriptlevel="0"><mi>Y</mi><mo stretchy="false">=</mo><mo stretchy="false">−</mo><mn>1</mn></mstyle></mrow></math><span typeof="mw:Entity"> </span>
in die Kurvengleichung einsetzt. Man erhält</p>
<dl><dd> <math class="mwe-math-element mwe-math-element-inline" typeof="mw:Extension/math" about="#mwt7" data-mw='{"name":"math","attrs":{},"body":{"extsrc":"{{}}  0\n  \n=  X^3+(-1)^3 +1\n\n=  X^3\n\n\n\n\n \n\n\n\n \\,   .\n"}}'><mrow data-mjx-texclass="ORD"><mstyle displaystyle="true" scriptlevel="0"><mn>0</mn><mo stretchy="false">=</mo><msup><mi>X</mi><mrow data-mjx-texclass="ORD"><mn>3</mn></mrow></msup><mo stretchy="false">+</mo><mo stretchy="false">(</mo><mo stretchy="false">−</mo><mn>1</mn><msup><mo stretchy="false">)</mo><mrow data-mjx-texclass="ORD"><mn>3</mn></mrow></msup><mo stretchy="false">+</mo><mn>1</mn><mo stretchy="false">=</mo><msup><mi>X</mi><mrow data-mjx-texclass="ORD"><mn>3</mn></mrow></msup><mspace width="0.167em"></mspace><mo stretchy="false">.</mo></mstyle></mrow></math></dd></dl>
<p>Die einzige Lösung ist
<span typeof="mw:Entity"> </span><math class="mwe-math-element mwe-math-element-inline" typeof="mw:Extension/math" about="#mwt8" data-mw='{"name":"math","attrs":{},"body":{"extsrc":" {{}} X\n  \n=  0"}}'><mrow data-mjx-texclass="ORD"><mstyle displaystyle="true" scriptlevel="0"><mi>X</mi><mo stretchy="false">=</mo><mn>0</mn></mstyle></mrow></math>,<span typeof="mw:Entity"> </span>
also ist <math class="mwe-math-element mwe-math-element-inline" typeof="mw:Extension/math" about="#mwt9" data-mw='{"name":"math","attrs":{},"body":{"extsrc":"{{}} (0,-1)"}}'><mrow data-mjx-texclass="ORD"><mstyle displaystyle="true" scriptlevel="0"><mo stretchy="false">(</mo><mn>0</mn><mo>,</mo><mo stretchy="false">−</mo><mn>1</mn><mo stretchy="false">)</mo></mstyle></mrow></math> der einzige Schnittpunkt von</p>
<math class="mwe-math-element mwe-math-element-inline" typeof="mw:Extension/math" about="#mwt10" data-mw='{"name":"math","attrs":{},"body":{"extsrc":"{{}}  G "}}'><mrow data-mjx-texclass="ORD"><mstyle displaystyle="true" scriptlevel="0"><mi>G</mi></mstyle></mrow></math> und  <math class="mwe-math-element mwe-math-element-inline" typeof="mw:Extension/math" about="#mwt11" data-mw='{"name":"math","attrs":{},"body":{"extsrc":" {{}}   C "}}'><mrow data-mjx-texclass="ORD"><mstyle displaystyle="true" scriptlevel="0"><mi>C</mi></mstyle></mrow></math>.</div><span about="#mwt1">
